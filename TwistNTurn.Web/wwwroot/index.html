<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Twist 'n' Turn - Masyu Logic Puzzle Game</title>
    <base href="./" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Twist 'n' Turn" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('twistnturn_theme') ||
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {}
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif;background-color:var(--bg-primary,#f8fafc);">
            <style>
                .initial-loader {
                    width: 48px;
                    height: 48px;
                    border: 4px solid #e2e8f0;
                    border-top-color: #2563eb;
                    border-radius: 50%;
                    animation: initial-spin 0.8s linear infinite;
                    margin-bottom: 1.25rem;
                }
                @keyframes initial-spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            <div class="initial-loader"></div>
            <div style="font-size:1.15rem;font-weight:600;color:var(--text-primary,#334155);">Loading Twist 'n' Turn...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        function safeInvoke(ref, method, ...args) {
            if (!ref) return;
            try {
                const p = ref.invokeMethodAsync(method, ...args);
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (_) {}
        }

        window.twistHelpers = {
            copyToClipboard: async (text) => {
                try {
                    if (navigator.clipboard) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (_) {}
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                try {
                    ta.select();
                    return document.execCommand('copy');
                } catch (_) {
                    return false;
                } finally {
                    if (ta.parentNode) document.body.removeChild(ta);
                }
            },
            getUrlHash: () => window.location.hash || '',
            setUrlHash: (hash) => {
                const base = window.location.pathname + window.location.search;
                if (history.replaceState) {
                    history.replaceState(null, '', hash ? base + '#' + hash : base);
                } else {
                    window._twistSuppressNextHashChange = true;
                    window.location.hash = hash || '';
                }
            },
            getBaseUrl: () => window.location.href.split('#')[0],
            setTheme: (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                try { localStorage.setItem('twistnturn_theme', theme); } catch (_) {}
            },
            getTheme: () => {
                try {
                    const saved = localStorage.getItem('twistnturn_theme');
                    if (saved) return saved;
                } catch (_) {}
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            },
            loadGameState: () => {
                try { return localStorage.getItem('twistnturn_gamestate'); } catch (_) { return null; }
            },
            saveGameState: (json) => {
                try { localStorage.setItem('twistnturn_gamestate', json); } catch (_) {}
            },
            clearGameState: () => {
                try { localStorage.removeItem('twistnturn_gamestate'); } catch (_) {}
            },
            loadSettings: () => {
                try { return localStorage.getItem('twistnturn_settings'); } catch (_) { return null; }
            },
            saveSettings: (json) => {
                try { localStorage.setItem('twistnturn_settings', json); } catch (_) {}
            },
            setWheelMode: (mode) => {
                window._twistWheelMode = mode || 'zoom';
            },
            downloadTextFile: (filename, content) => {
                try {
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    return true;
                } catch (_) {
                    return false;
                }
            },
            triggerPrint: () => {
                window.print();
            },
            hasPendingPwaUpdate: () => !!window._twistPwaUpdateReady,
            reloadFromServer: async () => {
                try {
                    if (window._twistWaitingWorker) {
                        const waiting = window._twistWaitingWorker;
                        window._twistWaitingWorker = null;
                        window._twistPwaUpdateReady = false;
                        await new Promise(resolve => {
                            let settled = false;
                            const finish = () => { if (!settled) { settled = true; resolve(); } };
                            if ('serviceWorker' in navigator) {
                                navigator.serviceWorker.addEventListener('controllerchange', finish, { once: true });
                            }
                            waiting.postMessage({ type: 'SKIP_WAITING' });
                            setTimeout(finish, 1500);
                        });
                        window.location.reload();
                        return;
                    }
                    if ('serviceWorker' in navigator) {
                        const regs = await navigator.serviceWorker.getRegistrations();
                        for (let r of regs) await r.unregister();
                    }
                    if ('caches' in window) {
                        const keys = await caches.keys();
                        for (let k of keys) await caches.delete(k);
                    }
                } catch (_) {}
                window.location.reload();
            }
        };

        window.registerTwistShortcuts = (dotNetRef) => {
            window._dotNetHomeRef = dotNetRef;
            if (window._twistHashChangeHandler) {
                window.removeEventListener('hashchange', window._twistHashChangeHandler);
            }
            window._twistHashChangeHandler = () => {
                if (window._twistSuppressNextHashChange) {
                    window._twistSuppressNextHashChange = false;
                    return;
                }
                if (!window._dotNetHomeRef) return;
                safeInvoke(window._dotNetHomeRef, 'OnUrlHashChanged', window.location.hash || '');
            };
            window.addEventListener('hashchange', window._twistHashChangeHandler);

            if (window._twistKeydownHandler) {
                window.removeEventListener('keydown', window._twistKeydownHandler);
            }
            window._twistKeydownHandler = (e) => {
                if (e.key === 'Escape') {
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', 'escape');
                    return;
                }
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
                const mod = e.ctrlKey || e.metaKey;
                if (!mod) return;

                if (e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', e.shiftKey ? 'redo' : 'undo');
                } else if (e.key === 'y' || e.key === 'Y') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', 'redo');
                } else if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', 'fix');
                } else if (e.key === 'u' || e.key === 'U') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', 'unfix');
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', 'revert');
                } else if (e.key === 'h' || e.key === 'H') {
                    e.preventDefault();
                    safeInvoke(window._dotNetHomeRef, 'OnShortcut', e.shiftKey ? 'dohint' : 'hint');
                }
            };
            window.addEventListener('keydown', window._twistKeydownHandler);

            if (window._twistPwaUpdateReady) {
                safeInvoke(dotNetRef, 'OnPwaUpdateAvailable');
            }
        };

        window.disposeTwistBoard = () => {
            window._dotNetHomeRef = null;
            if (window._twistHashChangeHandler) {
                window.removeEventListener('hashchange', window._twistHashChangeHandler);
                window._twistHashChangeHandler = null;
            }
            if (window._twistKeydownHandler) {
                window.removeEventListener('keydown', window._twistKeydownHandler);
                window._twistKeydownHandler = null;
            }
            if (window._twistWindowPointerUpHandler) {
                window.removeEventListener('pointerup', window._twistWindowPointerUpHandler);
                window._twistWindowPointerUpHandler = null;
            }
        };

        if (!window._twistGlobalTouchInit) {
            window._twistGlobalTouchInit = true;
            window._twistTouchCount = 0;
            const updateTouchCount = (e) => {
                window._twistTouchCount = e.touches ? e.touches.length : 0;
            };
            window.addEventListener('touchstart', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchend', updateTouchCount, { passive: true, capture: true });
            window.addEventListener('touchcancel', updateTouchCount, { passive: true, capture: true });
        }

        window.initTwistBoard = (svgId, dotNetRef) => {
            const svg = document.getElementById(svgId);
            if (!svg) return false;

            window._dotNetHomeRef = dotNetRef;
            svg._dotNetRef = dotNetRef;
            if (svg._twistInitialized) return true;
            svg._twistInitialized = true;

            const activePointers = new Map();
            let isMiddlePanning = false;
            let lastMouseX = 0, lastMouseY = 0;
            let pinchStartDist = 0;
            let pinchStartMidX = 0, pinchStartMidY = 0;

            let firstTouchTime = 0;
            let firstTouchStartX = 0;
            let firstTouchStartY = 0;
            let firstTouchPointerId = null;
            let firstTouchDispatched = false;
            let firstTouchMovedDist = 0;

            let pendingMoveCoords = null;
            let moveRafId = null;

            function flushPendingMove() {
                moveRafId = null;
                if (!pendingMoveCoords) return;
                const coords = pendingMoveCoords;
                pendingMoveCoords = null;
                safeInvoke(svg._dotNetRef, 'OnSvgPointerMove', coords.x, coords.y);
            }

            function resetPinchBaseline() {
                if (activePointers.size >= 2) {
                    const pts = Array.from(activePointers.values());
                    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    pinchStartMidX = (pts[0].x + pts[1].x) / 2;
                    pinchStartMidY = (pts[0].y + pts[1].y) / 2;
                } else {
                    pinchStartDist = 0;
                }
            }

            function getSvgCoords(e) {
                let pt = svg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;
                let ctm = svg.getScreenCTM();
                if (!ctm || !ctm.a || !ctm.d) return null;
                let p = pt.matrixTransform(ctm.inverse());
                if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return null;
                return { x: p.x, y: p.y };
            }

            svg.onpointerdown = (e) => {
                e.preventDefault();
                try { svg.setPointerCapture(e.pointerId); } catch (_) {}
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                const isTouch = e.pointerType === 'touch';
                const touchCount = window._twistTouchCount || 0;
                const alreadyMultipleFingers = isTouch && (activePointers.size > 1 || touchCount >= 2 || !e.isPrimary);

                if (activePointers.size === 1) {
                    if (e.button === 1) {
                        isMiddlePanning = true;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        return;
                    }

                    if (alreadyMultipleFingers) {
                        firstTouchDispatched = false;
                        return;
                    }

                    let coords = getSvgCoords(e);
                    if (!coords) return;

                    if (isTouch) {
                        firstTouchTime = performance.now();
                        firstTouchStartX = e.clientX;
                        firstTouchStartY = e.clientY;
                        firstTouchPointerId = e.pointerId;
                        firstTouchDispatched = true;
                        firstTouchMovedDist = 0;
                    }

                    safeInvoke(svg._dotNetRef, 'OnSvgPointerDown', coords.x, coords.y, e.button, e.shiftKey, e.ctrlKey || e.metaKey, e.altKey);
                } else if (activePointers.size === 2) {
                    const elapsed = performance.now() - firstTouchTime;
                    const isStationary = firstTouchMovedDist <= 20;
                    const shouldRevert = firstTouchDispatched && (elapsed <= 300 || (elapsed <= 600 && isStationary));

                    if (shouldRevert) {
                        safeInvoke(svg._dotNetRef, 'OnRevertFirstTouch');
                    } else {
                        safeInvoke(svg._dotNetRef, 'OnSvgPointerUp');
                    }

                    firstTouchDispatched = false;
                    resetPinchBaseline();
                }
            };

            svg.onpointermove = (e) => {
                if (!activePointers.has(e.pointerId)) return;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activePointers.size === 1) {
                    if (isMiddlePanning) {
                        let dx = e.clientX - lastMouseX;
                        let dy = e.clientY - lastMouseY;
                        lastMouseX = e.clientX;
                        lastMouseY = e.clientY;
                        let ctm = svg.getScreenCTM();
                        if (!ctm || !ctm.a || !ctm.d) return;
                        safeInvoke(svg._dotNetRef, 'OnPan', dx / ctm.a, dy / ctm.d);
                        return;
                    }

                    if (e.pointerId === firstTouchPointerId) {
                        const dist = Math.hypot(e.clientX - firstTouchStartX, e.clientY - firstTouchStartY);
                        if (dist > firstTouchMovedDist) {
                            firstTouchMovedDist = dist;
                        }
                    }

                    if (e.buttons === 0) return;
                    let coords = getSvgCoords(e);
                    if (!coords) return;
                    pendingMoveCoords = coords;
                    if (moveRafId === null) {
                        moveRafId = requestAnimationFrame(flushPendingMove);
                    }
                } else if (activePointers.size === 2) {
                    const pts = Array.from(activePointers.values());
                    const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    const currentMidX = (pts[0].x + pts[1].x) / 2;
                    const currentMidY = (pts[0].y + pts[1].y) / 2;

                    const scale = pinchStartDist > 0 ? (currentDist / pinchStartDist) : 1;
                    const dx = currentMidX - pinchStartMidX;
                    const dy = currentMidY - pinchStartMidY;
                    let ctm = svg.getScreenCTM();
                    if (!ctm || !ctm.a || !ctm.d) return;

                    safeInvoke(svg._dotNetRef, 'OnTwoFingerPanZoom', dx / ctm.a, dy / ctm.d, scale);

                    pinchStartDist = currentDist;
                    pinchStartMidX = currentMidX;
                    pinchStartMidY = currentMidY;
                }
            };

            const onPointerEnd = (e) => {
                const tracked = activePointers.has(e.pointerId);
                if (!tracked && !isMiddlePanning) return;

                try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
                if (tracked) {
                    activePointers.delete(e.pointerId);
                }

                if (e.type === 'pointercancel' && e.pointerId === firstTouchPointerId && firstTouchDispatched) {
                    const elapsed = performance.now() - firstTouchTime;
                    if (elapsed <= 600 && firstTouchMovedDist <= 20) {
                        safeInvoke(svg._dotNetRef, 'OnRevertFirstTouch');
                    }
                }

                if (e.pointerId === firstTouchPointerId) {
                    firstTouchDispatched = false;
                    firstTouchPointerId = null;
                }
                if (e.button === 1) {
                    isMiddlePanning = false;
                }
                if (activePointers.size === 0) {
                    isMiddlePanning = false;
                    pendingMoveCoords = null;
                    if (moveRafId !== null) {
                        cancelAnimationFrame(moveRafId);
                        moveRafId = null;
                    }
                    safeInvoke(svg._dotNetRef, 'OnSvgPointerUp');
                } else {
                    resetPinchBaseline();
                }
            };

            svg.onpointerup = onPointerEnd;
            svg.onpointercancel = onPointerEnd;
            if (window._twistWindowPointerUpHandler) {
                window.removeEventListener('pointerup', window._twistWindowPointerUpHandler);
            }
            window._twistWindowPointerUpHandler = onPointerEnd;
            window.addEventListener('pointerup', onPointerEnd);

            svg.onwheel = (e) => {
                e.preventDefault();
                if (window._twistWheelMode === 'undoredo' && !e.ctrlKey && !e.metaKey) {
                    safeInvoke(svg._dotNetRef, 'OnWheelUndoRedo', e.deltaY);
                    return;
                }
                let factor = e.deltaY < 0 ? 1.15 : 0.87;
                safeInvoke(svg._dotNetRef, 'OnWheelZoom', factor);
            };

            svg.oncontextmenu = (e) => {
                e.preventDefault();
            };
            return true;
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const notifyUpdate = (worker) => {
                    window._twistPwaUpdateReady = true;
                    window._twistWaitingWorker = worker;
                    safeInvoke(window._dotNetHomeRef, 'OnPwaUpdateAvailable');
                };

                navigator.serviceWorker.register('service-worker.js').then(reg => {
                    if (reg.waiting && navigator.serviceWorker.controller) {
                        notifyUpdate(reg.waiting);
                    }
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                notifyUpdate(newWorker);
                            }
                        });
                    });
                }).catch(err => console.log('SW registration error:', err));
            });
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
